<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">CRM: не просто контакт, а наступна дія</title><desc id="d">Приклад шляху контакту: новий, звʼязалися, кваліфіковано, зустріч, угода чи відмова. Відповідальний і час потрібні для кожної відкритої заявки.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#365e95"/></marker></defs><rect width="1100" height="700" rx="18" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="36" y="49" font-size="30" fill="#172b4d" font-weight="700">CRM: не просто контакт, а наступна дія</text><text x="36" y="83" font-size="21" fill="#526680" font-weight="400">Навчальна схема, не скріншот інтерфейсу</text><rect x="36" y="125" width="312" height="118" rx="14" fill="#edf5ff" stroke="#a8bdd9"/><text x="56" y="161" font-size="22" fill="#172b4d" font-weight="600">Новий контакт</text><text x="56" y="193" font-size="22" fill="#172b4d" font-weight="400">Джерело + час надходження</text><text x="56" y="225" font-size="22" fill="#172b4d" font-weight="400">Хто відповідає?</text><path d="M348 184 L388 184" fill="none" stroke="#365e95" stroke-width="3" marker-end="url(#a)"/><rect x="388" y="125" width="312" height="118" rx="14" fill="#edf5ff" stroke="#a8bdd9"/><text x="408" y="161" font-size="22" fill="#172b4d" font-weight="600">Звʼязалися</text><text x="408" y="193" font-size="22" fill="#172b4d" font-weight="400">Зафіксована перша відповідь</text><text x="408" y="225" font-size="22" fill="#172b4d" font-weight="400">Що потрібно клієнтові?</text><path d="M700 184 L740 184" fill="none" stroke="#365e95" stroke-width="3" marker-end="url(#a)"/><rect x="740" y="125" width="324" height="118" rx="14" fill="#edf5ff" stroke="#a8bdd9"/><text x="760" y="161" font-size="22" fill="#172b4d" font-weight="600">Кваліфіковано</text><text x="760" y="193" font-size="22" fill="#172b4d" font-weight="400">Підходить за критеріями</text><text x="760" y="225" font-size="22" fill="#172b4d" font-weight="400">Який наступний крок?</text><path d="M902 243 L902 320" fill="none" stroke="#365e95" stroke-width="3" marker-end="url(#a)"/><rect x="740" y="320" width="324" height="118" rx="14" fill="#edf5ff" stroke="#a8bdd9"/><text x="760" y="356" font-size="22" fill="#172b4d" font-weight="600">Перегляд / зустріч</text><text x="760" y="388" font-size="22" fill="#172b4d" font-weight="400">Конкретна дата й власник</text><text x="760" y="420" font-size="22" fill="#172b4d" font-weight="400">Клієнт підтвердив?</text><path d="M740 379 L700 379" fill="none" stroke="#365e95" stroke-width="3" marker-end="url(#a)"/><rect x="388" y="320" width="312" height="118" rx="14" fill="#edf5ff" stroke="#a8bdd9"/><text x="408" y="356" font-size="22" fill="#172b4d" font-weight="600">Угода / відмова</text><text x="408" y="388" font-size="22" fill="#172b4d" font-weight="400">Сума або причина відмови</text><text x="408" y="420" font-size="22" fill="#172b4d" font-weight="400">Не залишай порожньо</text><rect x="36" y="493" width="1028" height="118" rx="14" fill="#eaf8f0" stroke="#a8bdd9"/><text x="56" y="529" font-size="22" fill="#172b4d" font-weight="600">Правило кожного відкритого контакту</text><text x="56" y="561" font-size="22" fill="#172b4d" font-weight="400">Відповідальний + наступна дія + точний час. Прострочені дії видно окремо.</text><text x="56" y="593" font-size="22" fill="#172b4d" font-weight="400">Тест: надішли одну заявку й знайди її шлях від форми до статусу.</text><text x="36" y="649" font-size="22" fill="#172b4d" font-weight="400">Це приклад процесу. Статуси та час відповіді узгоджує твоя команда.</text><text x="36" y="674" font-size="18" fill="#526680" font-weight="400">Target Lab · Приклад навчальних даних · 2026-10-19</text></g></svg>