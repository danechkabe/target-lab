<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">Від бізнес-дії до аналітики й CRM</title><desc id="d">Форма породжує підтверджену подію, GA4 фіксує її, CRM веде контакт і статус. Контакти не передаються до GA4.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#365e95"/></marker></defs><rect width="1100" height="700" rx="18" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="36" y="49" font-size="30" fill="#172b4d" font-weight="700">Від бізнес-дії до аналітики й CRM</text><text x="36" y="83" font-size="21" fill="#526680" font-weight="400">Навчальна схема, не скріншот інтерфейсу</text><rect x="36" y="120" width="310" height="130" rx="14" fill="#edf5ff" stroke="#a8bdd9"/><text x="56" y="156" font-size="22" fill="#172b4d" font-weight="600">1. Людина надсилає форму</text><text x="56" y="188" font-size="22" fill="#172b4d" font-weight="400">Лише успішне прийняття</text><text x="56" y="220" font-size="22" fill="#172b4d" font-weight="400">Не просто клік на кнопку</text><path d="M346 185 L390 185" fill="none" stroke="#365e95" stroke-width="3" marker-end="url(#a)"/><rect x="390" y="120" width="310" height="130" rx="14" fill="#edf5ff" stroke="#a8bdd9"/><text x="410" y="156" font-size="22" fill="#172b4d" font-weight="600">2. Сайт підтверджує дію</text><text x="410" y="188" font-size="22" fill="#172b4d" font-weight="400">generate_lead</text><text x="410" y="220" font-size="22" fill="#172b4d" font-weight="400">Дозволені параметри</text><path d="M700 185 L744 185" fill="none" stroke="#365e95" stroke-width="3" marker-end="url(#a)"/><rect x="744" y="120" width="320" height="130" rx="14" fill="#edf5ff" stroke="#a8bdd9"/><text x="764" y="156" font-size="22" fill="#172b4d" font-weight="600">3. GA4 бачить подію</text><text x="764" y="188" font-size="22" fill="#172b4d" font-weight="400">Перевірка в DebugView</text><text x="764" y="220" font-size="22" fill="#172b4d" font-weight="400">1 дія → 1 подія</text><rect x="390" y="330" width="310" height="160" rx="14" fill="#eaf8f0" stroke="#a8bdd9"/><text x="410" y="366" font-size="22" fill="#172b4d" font-weight="600">4. CRM отримує контакт</text><text x="410" y="398" font-size="22" fill="#172b4d" font-weight="400">Джерело + час + власник</text><text x="410" y="430" font-size="22" fill="#172b4d" font-weight="400">Контакти лишаються тут</text><text x="410" y="462" font-size="22" fill="#172b4d" font-weight="400">Наступна дія призначена</text><path d="M545 250 L545 330" fill="none" stroke="#365e95" stroke-width="3" marker-end="url(#a)"/><path d="M700 410 L744 410" fill="none" stroke="#365e95" stroke-width="3" marker-end="url(#a)"/><rect x="744" y="330" width="320" height="160" rx="14" fill="#eaf8f0" stroke="#a8bdd9"/><text x="764" y="366" font-size="22" fill="#172b4d" font-weight="600">5. Продажі дають статус</text><text x="764" y="398" font-size="22" fill="#172b4d" font-weight="400">qualified_lead / угода</text><text x="764" y="430" font-size="22" fill="#172b4d" font-weight="400">Не вгадує браузер</text><text x="764" y="462" font-size="22" fill="#172b4d" font-weight="400">Потрібна інтеграція</text><text x="36" y="560" font-size="25" fill="#172b4d" font-weight="600">Перевір окремо: аналітику, CRM і підтвердження клієнтові.</text><text x="36" y="603" font-size="22" fill="#172b4d" font-weight="400">Не передавай імʼя, телефон або email у GA4, UTM чи назвах подій.</text><text x="36" y="674" font-size="18" fill="#526680" font-weight="400">Target Lab · Приклад навчальних даних · 2026-10-19</text></g></svg>