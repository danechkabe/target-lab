<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">Meta: кампанія → група → оголошення</title><desc id="d">Навчальна структура Meta з бізнес-ціллю кампанії, налаштуваннями групи та двома оголошеннями. Не відтворює інтерфейс Ads Manager.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#365e95"/></marker></defs><rect width="1100" height="700" rx="18" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="36" y="49" font-size="30" fill="#172b4d" font-weight="700">Meta: кампанія → група → оголошення</text><text x="36" y="83" font-size="21" fill="#526680" font-weight="400">Навчальна схема, не скріншот інтерфейсу</text><rect x="290" y="122" width="520" height="100" rx="14" fill="#edf5ff" stroke="#a8bdd9"/><text x="310" y="158" font-size="22" fill="#172b4d" font-weight="600">1. Campaign / Кампанія</text><text x="310" y="190" font-size="22" fill="#172b4d" font-weight="400">Бізнес-ціль: наприклад, Leads</text><path d="M550 222 L550 278" fill="none" stroke="#365e95" stroke-width="3" marker-end="url(#a)"/><rect x="230" y="278" width="640" height="134" rx="14" fill="#edf5ff" stroke="#a8bdd9"/><text x="250" y="314" font-size="22" fill="#172b4d" font-weight="600">2. Ad set / Група оголошень</text><text x="250" y="346" font-size="22" fill="#172b4d" font-weight="400">Де конверсія, подія оптимізації, аудиторія, розклад</text><text x="250" y="378" font-size="22" fill="#172b4d" font-weight="400">Бюджет може задаватися тут або на кампанії</text><path d="M410 412 L280 474" fill="none" stroke="#365e95" stroke-width="3" marker-end="url(#a)"/><path d="M690 412 L820 474" fill="none" stroke="#365e95" stroke-width="3" marker-end="url(#a)"/><rect x="36" y="474" width="500" height="120" rx="14" fill="#edf5ff" stroke="#a8bdd9"/><text x="56" y="510" font-size="22" fill="#172b4d" font-weight="600">3. Ad / Оголошення A</text><text x="56" y="542" font-size="22" fill="#172b4d" font-weight="400">Відео дороги + текст + CTA + URL</text><text x="56" y="574" font-size="22" fill="#172b4d" font-weight="400">utm_content=video_road_a</text><rect x="564" y="474" width="500" height="120" rx="14" fill="#edf5ff" stroke="#a8bdd9"/><text x="584" y="510" font-size="22" fill="#172b4d" font-weight="600">3. Ad / Оголошення B</text><text x="584" y="542" font-size="22" fill="#172b4d" font-weight="400">Фото ділянки + текст + CTA + URL</text><text x="584" y="574" font-size="22" fill="#172b4d" font-weight="400">utm_content=photo_land_b</text><text x="36" y="639" font-size="22" fill="#172b4d" font-weight="400">Назви полів і доступні рівні налаштувань залежать від типу кампанії.</text><text x="36" y="674" font-size="18" fill="#526680" font-weight="400">Target Lab · Приклад навчальних даних · 2026-10-19</text></g></svg>