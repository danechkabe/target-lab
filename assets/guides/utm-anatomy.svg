<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">UTM: адреса з читабельним контекстом реклами</title><desc id="d">Чотири UTM параметри: джерело facebook, тип paid_social, кампанія land_october і креатив video_road_a. example.com є прикладом, не готовою посадковою.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#365e95"/></marker></defs><rect width="1100" height="700" rx="18" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="36" y="49" font-size="30" fill="#172b4d" font-weight="700">UTM: адреса з читабельним контекстом реклами</text><text x="36" y="83" font-size="21" fill="#526680" font-weight="400">Навчальна схема, не скріншот інтерфейсу</text><rect x="36" y="120" width="1028" height="104" rx="14" fill="#edf5ff" stroke="#a8bdd9"/><text x="56" y="156" font-size="22" fill="#172b4d" font-weight="600">Адреса сторінки + ?перший_параметр + &amp;наступний_параметр</text><text x="56" y="188" font-size="22" fill="#172b4d" font-weight="400">https://example.com/land?utm_source=facebook&amp;utm_medium=paid_social</text><rect x="36" y="250" width="495" height="92" rx="14" fill="#edf5ff" stroke="#a8bdd9"/><text x="56" y="286" font-size="22" fill="#172b4d" font-weight="600">utm_source=facebook</text><text x="56" y="318" font-size="22" fill="#172b4d" font-weight="400">Звідки: джерело переходу</text><rect x="569" y="250" width="495" height="92" rx="14" fill="#edf5ff" stroke="#a8bdd9"/><text x="589" y="286" font-size="22" fill="#172b4d" font-weight="600">utm_medium=paid_social</text><text x="589" y="318" font-size="22" fill="#172b4d" font-weight="400">Який тип трафіку: платна соцмережа</text><rect x="36" y="365" width="495" height="92" rx="14" fill="#edf5ff" stroke="#a8bdd9"/><text x="56" y="401" font-size="22" fill="#172b4d" font-weight="600">utm_campaign=land_october</text><text x="56" y="433" font-size="22" fill="#172b4d" font-weight="400">До якої кампанії належить клік</text><rect x="569" y="365" width="495" height="92" rx="14" fill="#edf5ff" stroke="#a8bdd9"/><text x="589" y="401" font-size="22" fill="#172b4d" font-weight="600">utm_content=video_road_a</text><text x="589" y="433" font-size="22" fill="#172b4d" font-weight="400">Який креатив або варіант посилання</text><text x="36" y="511" font-size="22" fill="#172b4d" font-weight="400">Повний приклад, перенесений на два рядки для читання:</text><text x="36" y="552" font-size="22" fill="#172b4d" font-weight="400">https://example.com/land?utm_source=facebook&amp;utm_medium=paid_social</text><text x="36" y="587" font-size="22" fill="#172b4d" font-weight="400">&amp;utm_campaign=land_october&amp;utm_content=video_road_a</text><text x="36" y="635" font-size="22" fill="#172b4d" font-weight="400">Жодних телефонів, імен або email. UTM не доводить, що відбулася угода.</text><text x="36" y="674" font-size="18" fill="#526680" font-weight="400">Target Lab · Приклад навчальних даних · 2026-10-19</text></g></svg>